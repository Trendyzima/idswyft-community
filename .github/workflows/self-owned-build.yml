name: Self-owned identity stack

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'engine/**'
      - 'frontend/**'
      - 'shared/**'
      - 'docker-compose*.yml'
      - 'deploy/testagram/**'
      - '.github/workflows/self-owned-build.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'backend/**'
      - 'engine/**'
      - 'frontend/**'
      - 'shared/**'
      - 'docker-compose*.yml'
      - 'deploy/testagram/**'
      - '.github/workflows/self-owned-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: self-owned-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: Validate self-owned Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Render production Compose
        env:
          DB_PASSWORD: ci-db-password
          JWT_SECRET: ci-jwt-secret
          API_KEY_SECRET: ci-api-key-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SERVICE_TOKEN: ci-service-token
          CORS_ORIGINS: https://verify.testagram.site
          DOMAIN: verify.testagram.site
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.testagram.yml config --quiet
      - name: Verify required files
        run: |
          test -f docker-compose.testagram.yml
          test -f deploy/testagram/.env.self-owned.example
          test -f deploy/testagram/README.md

  source-build:
    name: Build application images from source
    needs: compose-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build engine, API and frontend locally
        env:
          DB_PASSWORD: ci-db-password
          JWT_SECRET: ci-jwt-secret
          API_KEY_SECRET: ci-api-key-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SERVICE_TOKEN: ci-service-token
          CORS_ORIGINS: https://verify.testagram.site
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.testagram.yml build --pull
